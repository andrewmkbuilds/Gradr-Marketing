name: Content and layout guardrails

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: JSON-LD, legal readiness, layout and visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Architecture guardrail (no TanStack Start)
        run: node scripts/check-no-tanstack.mjs

      - name: Tailwind utility class check (catches unknown classes like border-border)
        run: node scripts/check-tailwind-classes.mjs

      - name: TypeScript typecheck
        run: bun run typecheck

      # Static suites: structured data, Paddle legal readiness, Auth hero layout.
      - name: Unit and guardrail tests
        run: bunx vitest run src/test/structuredData.test.ts src/test/legalReadiness.test.ts src/test/authHeroLayout.test.ts src/test/seoShellHidden.test.ts

      - name: App icon, manifest and splash verification
        run: node scripts/generate-app-icons.mjs --check

      - name: Legal readiness (pre-deploy gate)
        run: node scripts/check-legal-readiness.mjs

      - name: Build
        run: bun run build

      - name: SEO and Open Graph tag check (home page)
        run: node scripts/check-seo-tags.mjs

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Serve build
        run: |
          bunx vite preview --port 8080 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done

      - name: Auth hero visual regression (Chrome, Firefox, Safari engines)
        env:
          AUTH_HERO_BROWSERS: chromium,firefox,webkit
        run: node scripts/auth-hero-visual.mjs http://localhost:8080

      - name: Smoke tests
        run: node scripts/smoke-test.mjs http://localhost:8080

      - name: Critical page smoke (renders expected UI, no loading/SEO flash)
        run: node scripts/smoke-critical-pages.mjs http://localhost:8080

      - name: 3D depth smoke (stages render, no blank route transitions)
        run: node scripts/depth-smoke.mjs http://localhost:8080

      - name: SEO fallback flash regression (light + dark, refresh + hard refresh)
        run: node scripts/seo-flash-regression.mjs http://localhost:8080

      # The built bundle exists at this point, so the scanner also sweeps dist/.
      - name: Architecture guardrail on build artifacts and lockfiles
        run: node scripts/check-no-tanstack.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-hero-screenshots
          path: artifacts/auth-hero
