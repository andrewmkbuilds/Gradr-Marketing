name: Auth hand-off

# Every landing CTA must leave the marketing bundle for https://app.gradr.me/auth.
# A CTA that navigates in-router lands on the NotFound hand-off instead — this
# workflow blocks that regression in both preview (local production build) and
# production modes, plus the unit rules for `?next=` validation.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

jobs:
  handoff:
    name: Landing CTAs reach app.gradr.me/auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit rules (deep-link validation, telemetry, retry event)
        run: bunx vitest run src/test/authHandoff.test.ts src/test/appLinks.test.ts

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build (preview mode bundle)
        run: bun run build

      - name: Serve the built bundle
        run: |
          bunx vite preview --port 8080 --strictPort &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done

      - name: CTA hand-off check — preview
        run: node scripts/check-cta-handoff.mjs http://localhost:8080

      - name: next= validation check — preview
        run: node scripts/check-next-validation.mjs http://localhost:8080

      - name: CTA hand-off check — production
        run: node scripts/check-cta-handoff.mjs https://gradr.me

      - name: next= validation check — production
        run: node scripts/check-next-validation.mjs https://gradr.me
