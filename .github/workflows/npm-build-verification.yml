name: Temporary npm build verification

on:
  push:
    branches: [main]

jobs:
  npm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install --legacy-peer-deps
      - run: npm run build
