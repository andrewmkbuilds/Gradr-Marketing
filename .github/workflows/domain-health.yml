name: Domain health

# Everything in this workflow asserts something about the DEPLOYED site:
# hostnames resolving, TLS terminating, each surface serving itself, the
# published CTAs still handing off to app.gradr.me, and the production
# response headers not disclosing the stack.
#
# It runs on a schedule and on demand rather than on every pull request: a PR
# cannot change what is currently published, so these checks would only report
# failures unrelated to the change under review.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  domains:
    name: DNS, TLS and redirect chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hostname healthcheck (DNS + TLS + surface)
        run: node scripts/domain-healthcheck.mjs

      - name: Production app-surface smoke (fails on any cross-domain redirect)
        run: node scripts/smoke-production-app.mjs

      - name: app.gradr.me must serve 200 (never 301/302 to gradr.me)
        run: node scripts/check-app-serving.mjs

      - name: OAuth callback preflight (no redirect to gradr.me)
        run: node scripts/preflight-oauth-callback.mjs

  published-surface:
    name: Published CTAs, separation and security headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: CTA hand-off check — production
        run: node scripts/check-cta-handoff.mjs https://gradr.me

      - name: next= validation check — production
        run: node scripts/check-next-validation.mjs https://gradr.me

      - name: Marketing separation check — production
        run: node scripts/check-marketing-separation.mjs https://gradr.me

      - name: Security headers and technology-disclosure gate (production)
        run: node scripts/check-security-headers.mjs https://gradr.me

      - name: Runtime header assertions (/auth and OAuth paths)
        env:
          RUN_HEADER_CHECKS: "1"
          SECURITY_HEADERS_TARGET: https://gradr.me
        run: bunx vitest run src/test/securityHeaders.test.ts
