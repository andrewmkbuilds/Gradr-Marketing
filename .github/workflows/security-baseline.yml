name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  database:
    name: Verify RLS policies, grants and SECURITY DEFINER privileges
    runs-on: ubuntu-latest
    # Fork pull requests cannot read repository secrets, so the database URL is
    # never available there. Running the job anyway would fail every fork PR on
    # a missing credential rather than on a real policy regression.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check database credentials are configured
        id: db
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL is not set — live database policy checks are skipped. Add the secret to enable them."
          fi

      - name: Install psql client
        if: steps.db.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify security baseline
        if: steps.db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-baseline.mjs

      - name: Fail on regression of resolved security findings
        if: steps.db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-findings-guard.mjs

      # These suites read the checked-in baseline manifest and only exercise
      # live-database assertions when DATABASE_URL is present, so they are
      # meaningful with or without the secret.
      - name: RLS and policy regression tests
        if: steps.db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bunx vitest run src/test/securityBaseline.test.ts src/test/userPreferencesAccess.test.ts

      # Request/response shapes of the endpoints and webhooks this surface uses.
      - name: API contract tests (schemas + negative cases)
        run: bunx vitest run src/test/apiContracts.test.ts

      - name: Live API contract replay against the deployed functions
        run: node scripts/check-api-contracts.mjs

  supply-chain:
    name: Dependency audit and bundle fingerprinting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (version floors + high/critical advisories)
        run: node scripts/dependency-audit.mjs

      - name: Build and gate bundle filenames against stack fingerprinting
        run: |
          bun run build
          node scripts/check-bundle-fingerprint.mjs
