name: Design system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tokens:
    name: Hardcoded-color lint gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      # Blocking: any hex/rgb/hsl literal in JSX class names or style props fails
      # the PR. The rule message names the semantic token to use instead.
      - name: ESLint (no hardcoded colors)
        run: bun run lint:colors

      - name: Theme token sweep (CSS + templates)
        run: bun run check:theme

      - name: Legacy design surface check
        run: bun run check:design

  interactions:
    name: Interaction regression (forms, preferences, auth hand-off, gallery)
    runs-on: ubuntu-latest
    # Pixel comparison across breakpoints and colour schemes is owned by the
    # visual-regression step in marketing-integrity.yml; duplicating it here
    # doubled CI time and produced two failures for every one real diff.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Serve build
        run: |
          bunx vite preview --port 8080 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done

      - name: Interaction regression
        run: bun run test:interactions
