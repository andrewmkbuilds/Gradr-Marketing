name: Design system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tokens:
    name: Hardcoded-color lint gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocking: any hex/rgb/hsl literal in JSX class names or style props fails
      # the PR. The rule message names the semantic token to use instead.
      - name: ESLint (no hardcoded colors)
        run: bun run lint:colors

      - name: Theme token sweep (CSS + templates)
        run: bun run check:theme

      - name: Legacy design surface check
        run: bun run check:design

  visual:
    name: Mobile + tablet visual regression and interaction checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Serve build
        run: |
          bunx vite preview --port 8080 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done

      - name: Visual regression (mobile + tablet)
        run: bun run test:visual:breakpoints

      - name: Interaction regression (forms, preferences, auth hand-off, gallery)
        run: bun run test:interactions

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakpoint-screenshots
          path: |
            tests/visual/current
            tests/visual/baseline
