services:
  web:
    image: oven/bun:1
    working_dir: /app
    ports:
      - "3000:8080"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      # Vite 5 dev server: allow the preview's external hostname.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Surface routing — render the app surface at "/".
      - VITE_GRADR_SURFACE=app
      # Pass through sandbox host domain / public suffix for any code that reads them.
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile
        exec bun run dev -- --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure

volumes:
  web_node_modules:
