    <script>
      // Paint the correct theme before first render so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem("gradr-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <style>
      /* Splash screen: painted before any JS bundle so there is never a flash
         of unstyled SEO markup. Removed by src/main.tsx once React mounts. */
      html, body { margin: 0; background: #f9f7f6; }
      html.dark, html.dark body { background: #10191d; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #f9f7f6;
        color: #245f73;
        font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 260ms ease;
      }
      html.dark #app-splash { background: #10191d; color: #f2f0ef; }
      #app-splash[data-hiding="true"] { opacity: 0; pointer-events: none; }
      #app-splash img { width: 56px; height: 56px; animation: splash-pulse 1.8s ease-in-out infinite; }
      #app-splash .splash-word {
        font-family: "Bricolage Grotesque", Georgia, serif;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      #app-splash .splash-track {
        width: 128px;
        height: 3px;
        border-radius: 999px;
        background: rgba(36, 95, 115, 0.16);
        overflow: hidden;
      }
      html.dark #app-splash .splash-track { background: rgba(242, 240, 239, 0.16); }
      #app-splash .splash-track span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #245f73;
        animation: splash-slide 1.15s ease-in-out infinite;
      }
      html.dark #app-splash .splash-track span { background: #f2f0ef; }
      @keyframes splash-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @keyframes splash-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img, #app-splash .splash-track span { animation: none; }
        #app-splash { transition: none; }
      }
      /* Fallback content for non-JS crawlers lives in <noscript>; nothing is
         hidden from users with CSS (no cloaking / hidden-text patterns). */
      noscript .no-js-shell {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1.25rem;
        font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1a2b31;
        line-height: 1.6;
      }
